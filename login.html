{% extends 'base.html' %}
{% block title %}Admin Login{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow border-0">
            <div class="card-header-custom text-white text-center py-4">
                <i class="fas fa-user-shield fa-3x mb-2"></i>
                <h4 class="mb-0">Admin Portal</h4>
            </div>
            <div class="card-body p-4">
                {% if error %}
                <div class="alert alert-danger alert-dismissible fade show">
                    <i class="fas fa-exclamation-circle me-2"></i>{{ error }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                {% endif %}

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="fas fa-user text-primary"></i>
                            </span>
                            <input type="text" name="username" class="form-control"
                                   placeholder="Admin username" required autofocus>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="fas fa-lock text-primary"></i>
                            </span>
                            <input type="password" name="password" class="form-control"
                                   placeholder="Admin password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 btn-lg">
                        <i class="fas fa-sign-in-alt me-2"></i>Login as Admin
                    </button>
                </form>

                <p class="text-center mt-3 mb-0">
                    <a href="{{ url_for('login') }}" class="text-muted small">
                        <i class="fas fa-arrow-left me-1"></i>Back to Student Login
                    </a>
                </p>
            </div>
        </div>

        <div class="alert alert-warning mt-3 text-center py-2">
            <small>
                <i class="fas fa-key me-1"></i>
                Default: <strong>admin</strong> / <strong>admin123</strong>
            </small>
        </div>
    </div>
</div>
{% endblock %}
